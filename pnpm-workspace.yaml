packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'
  - 'tests/*'
allowBuilds:
  # VitePress builds with esbuild, whose install script sets up its platform binary.
  esbuild: true
  # Pulled in by the OpenTelemetry exporters of examples/otel-node. Its install script only
  # checks versions: not needed, so not run.
  protobufjs: false
