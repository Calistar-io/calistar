name: CI

on:
  push:
    branches: [main, poc]
  pull_request:

# Actions are pinned by commit. The tag in the comment is what the commit was resolved from.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build, type check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  stack:
    name: Stack tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f infra/compose/compose.yaml -f infra/compose/compose.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 300 --build

      - name: Install the browser
        run: pnpm --filter @calistar/e2e exec playwright install --with-deps chromium

      - name: Stack tests
        run: pnpm test:stack

      - name: Logs of the stack
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
