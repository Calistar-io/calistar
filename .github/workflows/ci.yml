name: CI

on:
  push:
    branches: [main, poc]
  pull_request:
  workflow_dispatch:

# Actions are pinned by commit. The tag in the comment is what the commit was resolved from.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build, type check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  stack:
    name: Stack tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f infra/compose/compose.yaml -f infra/compose/compose.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 300 --build

      - name: Install the browser
        run: pnpm --filter @calistar/e2e exec playwright install --with-deps chromium

      - name: Stack tests
        run: pnpm test:stack

      - name: Logs of the stack
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  # The short load run of tests/load. It takes about 12 minutes, so it does not run on every
  # push: start it by hand, or put [load] in a commit message.
  load:
    name: Short load run
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[load]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f infra/compose/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 300 --build

      - name: Load run
        run: k6 run tests/load/api-ingest.js

      - name: Stored counts equal sent counts
        if: always()
        run: node tests/load/verify-counts.mjs

      - name: Report
        if: always()
        run: |
          echo "Hardware: $(nproc) CPUs, $(free -h | awk '/^Mem:/ {print $2}') memory, $(uname -sr)"
          {
            echo "### Short load run"
            echo
            echo '```json'
            cat tests/load/last-run.json
            echo '```'
            echo
            echo "Hardware: GitHub-hosted runner, $(nproc) CPUs, $(free -h | awk '/^Mem:/ {print $2}') memory, $(uname -sr)."
            echo
            echo '```'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-run
          path: tests/load/last-run.json

      - name: Logs of the stack
        if: failure()
        run: $COMPOSE logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
