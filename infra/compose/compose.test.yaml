# Additions for the stack tests. Use together with compose.yaml:
#
#   docker compose -f infra/compose/compose.yaml -f infra/compose/compose.test.yaml up -d --wait
#
# It publishes, on 127.0.0.1 only, what the tests must reach and the base file keeps private:
# Umami (provisioning and sign-in, as the console will do from the private network),
# PostgreSQL (to check what was stored) and the gateway's public listener (so a test can stand in
# for the reverse proxy and choose the address the gateway sees).

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-15432}:5432"

  umami:
    ports:
      - "127.0.0.1:${UMAMI_TEST_PORT:-13000}:3000"

  gateway:
    ports:
      - "127.0.0.1:${GATEWAY_TEST_PORT:-18080}:8080"
